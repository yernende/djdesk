# Conventional HTTPS reverse proxy; replace the hostname and certificate paths.
server {
    listen 443 ssl http2;
    server_name djdesk.example.com;

    ssl_certificate /etc/letsencrypt/live/djdesk.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/djdesk.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/djdesk/current/apps/client/dist;
    client_max_body_size 96k;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/djdesk-error.log warn;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location ~ ^/(api(?:/|$)|health$) {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
